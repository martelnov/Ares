[package]
name = "hades"
version = "0.1.0"
edition = "2021"
description = "OLYMP HADES - experimental MS-TDS authentication honeypot"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
libc = "0.2"
zeroize = "1"
