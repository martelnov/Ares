[package]
name = "phobos-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
ironrdp-server = { path = "../crates/ironrdp-server", default-features = false, features = ["helper"] }
sspi = { version = "0.23", features = ["network_client"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }

[workspace]

[patch.crates-io]
sspi = { path = "../../vendor/sspi" }
