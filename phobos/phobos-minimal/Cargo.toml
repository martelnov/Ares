[package]
name = "phobos-minimal"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

tokio = { version = "1", features = [
    "macros",
    "rt",
    "net",
    "time",
    "io-util", "sync"
] }

tokio-rustls = "0.26"
x509-cert = "0.3"

ironrdp-acceptor = { path = "../crates/ironrdp-acceptor" }
ironrdp-tokio = { path = "../crates/ironrdp-tokio", features = ["reqwest"] }
ironrdp-pdu = { path = "../crates/ironrdp-pdu" }

sspi = { version = "0.23.1", features = ["network_client"] }

[workspace]

[patch.crates-io]
sspi = { path = "../../vendor/sspi" }
